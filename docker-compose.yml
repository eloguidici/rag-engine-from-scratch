services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
    ports:
      - "5432:5432"
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 10

  rag-api:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      RAG_PERSISTENCE: postgres
      DATABASE_URL: postgresql://rag:rag@postgres:5432/rag
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  rag-postgres-data:
